<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Vendor Risk Scorecard</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:system-ui;background:#0d1117;color:#e6edf3;max-width:720px;margin:auto;padding:2rem}h1{color:#58a6ff}a{color:#58a6ff}label{display:block;margin:.4rem 0}select{padding:.4rem}button{background:#1f6feb;color:#fff;border:0;padding:.6rem 1rem;border-radius:8px}#out{margin-top:1rem;background:#161b22;padding:1rem;border-radius:8px;white-space:pre-wrap}</style></head><body><h1>📊 Vendor Risk Scorecard</h1><p>Rate a vendor across 4 dimensions (1=low risk, 5=high risk).</p><label>Security posture <select id="s"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option></select></label><label>Financial stability <select id="f"><option>1</option><option selected>2</option><option>3</option><option>4</option><option>5</option></select></label><label>Compliance <select id="c"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option></select></label><label>Operational dependency <select id="o"><option>1</option><option>2</option><option>3</option><option selected>4</option><option>5</option></select></label><button onclick="go()">Score vendor</button><div id="out"></div><script>function go(){const v=['s','f','c','o'].map(id=>+document.getElementById(id).value);const w=[0.35,0.2,0.25,0.2];const sc=(v[0]*w[0]+v[1]*w[1]+v[2]*w[2]+v[3]*w[3]).toFixed(1);document.getElementById('out').textContent=`Weighted risk score: ${sc}/5 — ${sc>=3.5?'🔴 HIGH RISK':sc>=2.5?'🟡 MEDIUM':'🟢 LOW RISK'}\nRecommendation: ${sc>=3.5?'Require remediation plan or dual-vendor strategy':sc>=2.5?'Quarterly monitoring + contract SLAs':'Annual review sufficient'}\n\nFull vendor risk program: commercial@ziontechgroup.com`}</script><p><a href="https://ziontechgroup.com/apps/">← Zion App Network</a> · <a href="https://github.com/Zion-support/vendor-risk-scorecard">GitHub</a> · <a href="https://ziontechgroup.com/zion-ai-procurement/">Procurement</a></p></body></html>
